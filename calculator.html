<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calc — a small, sturdy calculator</title>
<style>
  :root{
    --body-dark: #1c1f26;
    --body-darker: #14161b;
    --lcd-bg: #1b2118;
    --lcd-glow: #ffb000;
    --lcd-glow-dim: #7a5600;
    --key-num: #e8e6e1;
    --key-num-text: #22252a;
    --key-op: #3a6b63;
    --key-op-text: #eafaf6;
    --key-eq: #e8622c;
    --key-eq-text: #fff3ec;
    --key-func: #565d68;
    --key-func-text: #eef0f2;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(circle at 30% 20%, #2a2e38 0%, transparent 55%),
      var(--body-darker);
    font-family: 'Space Mono', 'JetBrains Mono', monospace;
    padding: 24px;
  }

  .device{
    width: 340px;
    max-width: 100%;
    background: linear-gradient(160deg, var(--body-dark), var(--body-darker));
    border-radius: 28px;
    padding: 20px;
    box-shadow:
      0 30px 60px -20px rgba(0,0,0,0.6),
      0 2px 0 rgba(255,255,255,0.04) inset,
      0 -2px 0 rgba(0,0,0,0.4) inset;
    border: 1px solid rgba(255,255,255,0.05);
  }

  .brand{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding: 2px 6px 14px;
    color: #6b7280;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .brand span:last-child{ color: #4b5563; }

  .screen{
    background: var(--lcd-bg);
    border-radius: 14px;
    padding: 22px 18px 16px;
    margin-bottom: 18px;
    box-shadow: inset 0 3px 10px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(255,176,0,0.06);
    position: relative;
    overflow: hidden;
  }
  .screen::after{
    content:"";
    position:absolute; inset:0;
    background: repeating-linear-gradient(
      0deg, rgba(0,0,0,0.12) 0px, rgba(0,0,0,0.12) 1px, transparent 1px, transparent 3px
    );
    pointer-events:none;
    opacity: 0.5;
  }

  .expression{
    min-height: 18px;
    color: var(--lcd-glow-dim);
    font-size: 14px;
    text-align: right;
    letter-spacing: 0.03em;
    white-space: nowrap;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .expression::-webkit-scrollbar{ display:none; }

  .result{
    color: var(--lcd-glow);
    text-shadow: 0 0 14px rgba(255,176,0,0.55), 0 0 2px rgba(255,176,0,0.8);
    font-size: 42px;
    font-weight: 700;
    text-align: right;
    line-height: 1.2;
    white-space: nowrap;
    overflow-x: auto;
    scrollbar-width: none;
    margin-top: 6px;
    transition: opacity 0.08s ease;
  }
  .result::-webkit-scrollbar{ display:none; }

  .keys{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }

  button{
    font-family: inherit;
    border: none;
    border-radius: 12px;
    font-size: 18px;
    padding: 16px 0;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.05s ease, filter 0.15s ease, box-shadow 0.15s ease;
    box-shadow: 0 3px 0 rgba(0,0,0,0.35), 0 4px 8px rgba(0,0,0,0.25);
  }
  button:active{
    transform: translateY(3px);
    box-shadow: 0 0 0 rgba(0,0,0,0.35);
  }
  button:focus-visible{
    outline: 2px solid var(--lcd-glow);
    outline-offset: 2px;
  }

  .num{ background: var(--key-num); color: var(--key-num-text); font-weight: 600; }
  .num:hover{ filter: brightness(1.05); }

  .op{ background: var(--key-op); color: var(--key-op-text); font-weight: 700; }
  .op:hover{ filter: brightness(1.12); }
  .op.active{ filter: brightness(1.3); box-shadow: 0 0 0 2px var(--lcd-glow) inset, 0 3px 0 rgba(0,0,0,0.35); }

  .func{ background: var(--key-func); color: var(--key-func-text); font-size: 15px; font-weight: 600; }
  .func:hover{ filter: brightness(1.12); }

  .eq{ background: var(--key-eq); color: var(--key-eq-text); font-weight: 700; font-size: 20px; }
  .eq:hover{ filter: brightness(1.08); }

  .span-2{ grid-column: span 2; }

  @media (prefers-reduced-motion: reduce){
    button{ transition: none; }
  }
</style>
</head>
<body>

<div class="device">
  <div class="brand"><span>Calc · Mk 1</span><span>Deg</span></div>

  <div class="screen">
    <div class="expression" id="expression">&nbsp;</div>
    <div class="result" id="result">0</div>
  </div>

  <div class="keys">
    <button class="func" data-action="clear">AC</button>
    <button class="func" data-action="backspace">⌫</button>
    <button class="func" data-action="percent">%</button>
    <button class="op" data-action="divide">÷</button>

    <button class="num" data-num="7">7</button>
    <button class="num" data-num="8">8</button>
    <button class="num" data-num="9">9</button>
    <button class="op" data-action="multiply">×</button>

    <button class="num" data-num="4">4</button>
    <button class="num" data-num="5">5</button>
    <button class="num" data-num="6">6</button>
    <button class="op" data-action="subtract">−</button>

    <button class="num" data-num="1">1</button>
    <button class="num" data-num="2">2</button>
    <button class="num" data-num="3">3</button>
    <button class="op" data-action="add">+</button>

    <button class="func" data-action="sign">±</button>
    <button class="num" data-num="0">0</button>
    <button class="num" data-num=".">.</button>
    <button class="eq" data-action="equals">=</button>
  </div>
</div>

<script>
(function(){
  const expressionEl = document.getElementById('expression');
  const resultEl = document.getElementById('result');

  let current = '0';
  let previous = null;
  let operator = null;
  let justEvaluated = false;
  let expressionText = '';

  const opSymbols = { add:'+', subtract:'−', multiply:'×', divide:'÷' };

  function formatNumber(numStr){
    if (numStr === 'Error') return numStr;
    const num = Number(numStr);
    if (!isFinite(num)) return 'Error';
    // Limit displayed precision, but keep integer look clean
    let s = numStr;
    if (s.includes('.')) {
      let [intPart, decPart] = s.split('.');
      if (decPart.length > 8) decPart = decPart.slice(0, 8);
      s = decPart.length ? intPart + '.' + decPart : intPart;
    }
    return addThousandsSeparators(s);
  }

  function addThousandsSeparators(numStr){
    let neg = numStr.startsWith('-');
    if (neg) numStr = numStr.slice(1);
    let [intPart, decPart] = numStr.split('.');
    intPart = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    let out = decPart !== undefined ? intPart + '.' + decPart : intPart;
    return (neg ? '-' : '') + out;
  }

  function updateDisplay(){
    resultEl.textContent = formatNumber(current);
    expressionEl.textContent = expressionText || '\u00A0';
    // auto-shrink font for very long numbers
    const len = resultEl.textContent.length;
    resultEl.style.fontSize = len > 12 ? (len > 16 ? '26px' : '32px') : '42px';
  }

  function clearAll(){
    current = '0';
    previous = null;
    operator = null;
    justEvaluated = false;
    expressionText = '';
    document.querySelectorAll('.op').forEach(b => b.classList.remove('active'));
    updateDisplay();
  }

  function inputDigit(d){
    if (justEvaluated){
      current = '0';
      expressionText = '';
      justEvaluated = false;
      document.querySelectorAll('.op').forEach(b => b.classList.remove('active'));
    }
    if (d === '.'){
      if (current.includes('.')) return;
      current = current === '0' ? '0.' : current + '.';
    } else {
      if (current === '0') current = d;
      else if (current.length < 16) current = current + d;
    }
    updateDisplay();
  }

  function backspace(){
    if (justEvaluated) { clearAll(); return; }
    if (current.length <= 1 || (current.length === 2 && current.startsWith('-'))) {
      current = '0';
    } else {
      current = current.slice(0, -1);
    }
    updateDisplay();
  }

  function toggleSign(){
    if (current === '0') return;
    current = current.startsWith('-') ? current.slice(1) : '-' + current;
    updateDisplay();
  }

  function percent(){
    current = String(Number(current) / 100);
    updateDisplay();
  }

  function compute(a, b, op){
    a = Number(a); b = Number(b);
    switch(op){
      case 'add': return a + b;
      case 'subtract': return a - b;
      case 'multiply': return a * b;
      case 'divide': return b === 0 ? NaN : a / b;
      default: return b;
    }
  }

  function setOperator(op){
    if (operator && previous !== null && !justEvaluated){
      // chain: evaluate pending operation first
      const res = compute(previous, current, operator);
      current = isFinite(res) ? trimResult(res) : 'Error';
      previous = current;
    } else {
      previous = current;
    }
    operator = op;
    justEvaluated = false;
    expressionText = formatNumber(previous) + ' ' + opSymbols[op];
    current = '0';
    document.querySelectorAll('.op').forEach(b => b.classList.remove('active'));
    const activeBtn = document.querySelector('[data-action="' + op + '"]');
    if (activeBtn) activeBtn.classList.add('active');
    updateDisplay();
  }

  function trimResult(num){
    if (!isFinite(num)) return 'Error';
    let s = num.toString();
    if (s.includes('e')) s = num.toFixed(10).replace(/0+$/,'').replace(/\.$/,'');
    return s;
  }

  function equals(){
    if (operator === null || previous === null) return;
    const res = compute(previous, current, operator);
    expressionText = formatNumber(previous) + ' ' + opSymbols[operator] + ' ' + formatNumber(current) + ' =';
    current = isFinite(res) ? trimResult(res) : 'Error';
    previous = null;
    operator = null;
    justEvaluated = true;
    document.querySelectorAll('.op').forEach(b => b.classList.remove('active'));
    updateDisplay();
  }

  document.querySelectorAll('[data-num]').forEach(btn => {
    btn.addEventListener('click', () => inputDigit(btn.getAttribute('data-num')));
  });

  document.querySelectorAll('[data-action]').forEach(btn => {
    btn.addEventListener('click', () => {
      const action = btn.getAttribute('data-action');
      switch(action){
        case 'clear': clearAll(); break;
        case 'backspace': backspace(); break;
        case 'sign': toggleSign(); break;
        case 'percent': percent(); break;
        case 'equals': equals(); break;
        case 'add': case 'subtract': case 'multiply': case 'divide':
          setOperator(action); break;
      }
    });
  });

  window.addEventListener('keydown', (e) => {
    if (e.key >= '0' && e.key <= '9') inputDigit(e.key);
    else if (e.key === '.') inputDigit('.');
    else if (e.key === '+') setOperator('add');
    else if (e.key === '-') setOperator('subtract');
    else if (e.key === '*') setOperator('multiply');
    else if (e.key === '/') { e.preventDefault(); setOperator('divide'); }
    else if (e.key === 'Enter' || e.key === '=') { e.preventDefault(); equals(); }
    else if (e.key === 'Backspace') backspace();
    else if (e.key === 'Escape') clearAll();
    else if (e.key === '%') percent();
  });

  updateDisplay();
})();
</script>

</body>
</html>
